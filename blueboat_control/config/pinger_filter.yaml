# Pinger filter parameters: every knob, its range, and in plain words what it changes.
#
# Read by the pinger_estimator node (pinger_params.py) and by the station (BlueBoat-MCS builds its pinger
# filter dialog from this file). The defaults ARE the `slow_rov` preset; a preset lists only what it changes.
#
# TUNING LIVE: launch with `pinger_filter_yaml:=<your file>` (BlueBoat_launch.py) and edit that file while
# the boat runs. Every save is applied within a second, without losing the estimate; a bad value is refused
# with the reason in the log and the previous set stays. The file names only what you change:
#     preset: slow_rov
#     params:
#       latency_s: 1.2
#       sigma_bearing_deg: 15.0
# Symptom -> knob: FIELD_TUNING.md, "Pinger filter".
#
# Frames: acoustic (a_x, a_y, a_z) as Water Linked reports them; body = the boat (x forward, y left);
# world = /blueboat/odom. Depth is positive down.

schema: blueboat_pinger_filter/1

groups:
  - Input & geometry
  - Validity
  - Motion model
  - Measurement noise
  - Robustness
  - Re-acquisition
  - Output & safety

parameters:
  # ---------------------------------------------------------------- Input & geometry
  source:
    group: Input & geometry
    type: enum
    choices: [raw, filtered]
    default: raw
    unit: ""
    description: "Which Water Linked position the filter uses. raw: the unit's own fix, fresh but noisy (default). filtered: Water Linked's smoothed fix, steadier but at least 1 s older."
  latency_s:
    group: Input & geometry
    type: float
    unit: s
    default: 1.5
    min: 0.0
    max: 5.0
    description: "How old a fix is when it arrives; each fix is placed with the boat's pose of that moment. Wrong (either way): while the boat turns, a still pinger smears into an arc and shifts with every turn. Right: the fixes stay in one place while the boat turns on the spot. Provisional 1.5 s."
  y_sign:
    group: Input & geometry
    type: int
    unit: ""
    default: 1
    min: -1
    max: 1
    description: "Left/right of the USBL antenna. +1: as installed. -1 mirrors it; only after re-mounting the antenna, if a pinger on the boat's left is drawn on its right."
  z_sign:
    group: Input & geometry
    type: int
    unit: ""
    default: 1
    min: -1
    max: 1
    description: "Depth sign. +1: depth positive down, as Water Linked reports it. -1 flips it; only if the pinger depth reads negative."
  mount_yaw_deg:
    group: Input & geometry
    type: float
    unit: deg
    default: 0.0
    min: -180.0
    max: 180.0
    description: "Rotation of the USBL antenna against the boat's bow (counter-clockwise positive). Wrong: a still pinger seems to circle its true place as the boat changes heading. Adjust until circling a still pinger gives a cloud of fixes, not a ring."
  lever_x_m:
    group: Input & geometry
    type: float
    unit: m
    default: 0.0
    min: -5.0
    max: 5.0
    description: "How far forward of the boat's position point the antenna sits. Wrong: the pinger is off by that error along the boat's heading, so it moves as the boat turns."
  lever_y_m:
    group: Input & geometry
    type: float
    unit: m
    default: 0.0
    min: -5.0
    max: 5.0
    description: "How far left of the boat's position point the antenna sits. Wrong: the pinger is off by that error sideways, so it moves as the boat turns."
  # ---------------------------------------------------------------- Validity
  min_range_m:
    group: Validity
    type: float
    unit: m
    default: 0.2
    min: 0.0
    max: 10.0
    description: "Fixes closer than this to the antenna are ignored. Raise it if fixes right under the boat are wild."
  max_range_m:
    group: Validity
    type: float
    unit: m
    default: 60.0
    min: 1.0
    max: 1000.0
    description: "Fixes farther than this are ignored. Lower it to the size of the area (a pool) to drop impossible far-off fixes."
  require_position_valid:
    group: Validity
    type: bool
    unit: ""
    default: true
    description: "Ignore fixes that Water Linked itself flags as invalid. Turn off only if the unit flags good fixes as invalid; it lets more bad fixes in."
  min_receivers:
    group: Validity
    type: int
    unit: ""
    default: 3
    min: 0
    max: 4
    description: "Ignore fixes heard by fewer receivers than this. Raise: fewer but more reliable fixes. Lower: more fixes in poor acoustic conditions, more of them wrong."
  # ---------------------------------------------------------------- Motion model
  model:
    group: Motion model
    type: enum
    choices: [cv, static]
    default: cv
    unit: ""
    description: "cv: the pinger moves (a robot); the filter also tracks its speed. static: the pinger is on a fixed object; position only, the steadiest. Changing it restarts the estimate."
  sigma_a:
    group: Motion model
    type: float
    unit: m/s^2
    default: 0.02
    min: 0.0
    max: 5.0
    description: "How quickly the robot may change speed or direction (cv). Raise: follows the robot's turns sooner, but wanders while it is still. Lower: smoother and steadier, but overshoots corners and turns late."
  v_max:
    group: Motion model
    type: float
    unit: m/s
    default: 0.5
    min: 0.0
    max: 5.0
    description: "The fastest the estimate may move (cv). Set it a little above the robot's real top speed. Too low: the estimate falls behind a moving robot. Too high: a wild fix can drag it faster."
  static_drift:
    group: Motion model
    type: float
    unit: m/sqrt(s)
    default: 0.01
    min: 0.0
    max: 1.0
    description: "How much a pinger on a fixed object may still drift (static). Raise: follows a slow drift sooner but is less steady. Lower: steadier."
  depth_drift:
    group: Motion model
    type: float
    unit: m/sqrt(s)
    default: 0.02
    min: 0.0
    max: 1.0
    description: "How quickly the pinger's depth may change. Raise: the depth follows changes sooner but is noisier. Lower: steadier depth."
  # ---------------------------------------------------------------- Measurement noise
  range_floor_m:
    group: Measurement noise
    type: float
    unit: m
    default: 0.1
    min: 0.0
    max: 10.0
    description: "Distance error of a fix even at short range. Raise: each fix's distance is trusted less (smoother, slower). Lower: trusted more."
  range_k:
    group: Measurement noise
    type: float
    unit: ""
    default: 0.2
    min: 0.0
    max: 1.0
    description: "Distance error per metre of range (0.2 = 20 %). Raise: far fixes count less. Lower: far fixes count more."
  sigma_bearing_deg:
    group: Measurement noise
    type: float
    unit: deg
    default: 12.0
    min: 0.1
    max: 60.0
    description: "How noisy a fix's direction is (the sideways error, as an angle). The main smoothing knob. Raise: steadier, slower to follow a real move. Lower: follows sooner, jumps with the noise. Field data: 13-17 deg."
  sigma_heading_deg:
    group: Measurement noise
    type: float
    unit: deg
    default: 2.0
    min: 0.0
    max: 30.0
    description: "Error of the boat's own heading, added to the direction error. Raise it if the compass is poor: far fixes then count less."
  sigma_time_s:
    group: Measurement noise
    type: float
    unit: s
    default: 0.3
    min: 0.0
    max: 3.0
    description: "Uncertainty of the fix delay. While the boat turns it makes fixes count less, the more the faster it turns. Raise: steadier during turns. Lower: fixes taken in turns count more."
  use_wl_std:
    group: Measurement noise
    type: bool
    unit: ""
    default: true
    description: "Never trust a fix more than Water Linked's own error estimate allows. Turn off to ignore the unit's error estimate."
  depth_sigma_m:
    group: Measurement noise
    type: float
    unit: m
    default: 0.3
    min: 0.01
    max: 10.0
    description: "Error of one depth reading. Raise: steadier depth, slower to change. Lower: the depth follows each fix more."
  # ---------------------------------------------------------------- Robustness
  gate_soft:
    group: Robustness
    type: float
    unit: ""
    default: 5.99
    min: 0.5
    max: 100.0
    description: "How far (statistically) a fix may land from the estimate before it is believed less; 5.99 lets 95 % of good fixes through. Lower: more fixes are doubted (steadier, slower to follow). Raise: wild fixes are believed and pull the estimate off."
  gate_hard:
    group: Robustness
    type: float
    unit: ""
    default: 18.42
    min: 1.0
    max: 1000.0
    description: "Beyond this (statistical) distance a fix that would also need an impossible speed (v_hard) is ignored outright. Lower: more far-off fixes ignored. Raise: fewer. Must be at least gate_soft."
  v_hard:
    group: Robustness
    type: float
    unit: m/s
    default: 1.5
    min: 0.0
    max: 20.0
    description: "The speed the pinger would need to reach a far-off fix; above it (and beyond gate_hard) the fix is ignored. Lower: more jumps ignored. Raise: faster moves accepted."
  # ---------------------------------------------------------------- Re-acquisition
  init_n:
    group: Re-acquisition
    type: int
    unit: ""
    default: 3
    min: 1
    max: 20
    description: "How many fixes must agree before the estimate starts. Raise: a safer start that takes longer. Lower: starts sooner, possibly on bad fixes."
  init_radius_m:
    group: Re-acquisition
    type: float
    unit: m
    default: 3.0
    min: 0.1
    max: 50.0
    description: "How close to each other those starting fixes must be. Raise: starts sooner in noisy water. Lower: a stricter start."
  init_window_s:
    group: Re-acquisition
    type: float
    unit: s
    default: 10.0
    min: 0.5
    max: 120.0
    description: "Time within which the starting fixes must arrive. Raise it if fixes are sparse and the estimate never starts."
  reinit_n:
    group: Re-acquisition
    type: int
    unit: ""
    default: 4
    min: 2
    max: 20
    description: "How many doubted fixes in a row, if they agree, make the estimate jump to them (the robot was moved). Raise: jumps less readily, safer against bursts of wild fixes. Lower: jumps sooner."
  reinit_radius_m:
    group: Re-acquisition
    type: float
    unit: m
    default: 2.0
    min: 0.1
    max: 50.0
    description: "How close to each other those fixes must be to jump. Raise (5-8 m) if the estimate is slow to follow a robot that was moved. Lower: jumps only on very consistent fixes."
  reinit_window_s:
    group: Re-acquisition
    type: float
    unit: s
    default: 6.0
    min: 0.5
    max: 120.0
    description: "Time within which those fixes must arrive. Raise it if fixes are sparse and a moved robot is never re-acquired."
  # ---------------------------------------------------------------- Output & safety
  coast_after_s:
    group: Output & safety
    type: float
    unit: s
    default: 2.0
    min: 0.1
    max: 60.0
    description: "Seconds without a new fix before the estimate is 'coasting' (still followed). Shorter: a dropout is shown sooner."
  stale_timeout_s:
    group: Output & safety
    type: float
    unit: s
    default: 6.0
    min: 0.5
    max: 300.0
    description: "Seconds without a new fix before the estimate is 'stale': Follow mode then holds the boat in place. Raise it if the boat stops during short dropouts; lower it if the boat keeps driving to an out-of-date position. Must be at least coast_after_s."

presets:
  slow_rov:
    description: "Default: a slow underwater robot (the brush robot crawls at 0.1-0.3 m/s)."
    values: {}
  static_target:
    description: "A pinger on a fixed object: position only, with a tiny drift."
    values:
      model: static
      v_max: 0.0
      init_radius_m: 5.0

# ---------------------------------------------------------------- the station's "Field tuning" tab
# The knobs worth touching in the field, each with a picture of its effect (pinger_tuning/<file>, beside
# this file: the filter at a low value, the default and a high value). `slider`: the card's slider range,
# [low, high, lin|log]. Read by the station only.
field_tuning:
  - title: "Fix delay"
    params: [latency_s]
    slider: {latency_s: [0.0, 4.0, lin]}
    picture: pinger_tuning/latency_s.png
    what: "How old a USBL fix is when it arrives. The filter places each fix with the boat pose of that moment, not of now."
    lower: "Too low: while the boat turns, fixes are swung around the boat; the pinger smears into a blob and shifts with every turn."
    higher: "Too high: the same smear, the other way round."
    field: "With the pinger still, turn the boat on the spot; the right value makes the fixes stay in one place during turns. Provisional 1.5 s."
  - title: "Receiver rotation"
    params: [mount_yaw_deg]
    slider: {mount_yaw_deg: [-45.0, 45.0, lin]}
    picture: pinger_tuning/mount_yaw_deg.png
    what: "How the USBL antenna's forward direction is rotated against the boat's bow."
    lower: "Wrong either way: a still pinger seems to circle around its true place as the boat changes heading."
    higher: "Wrong either way: the same ring, turning the other way."
    field: "Circle a still pinger; adjust until the fixes form a cloud instead of a ring. Data so far say 0 deg."
  - title: "Left / right mirror"
    params: [y_sign]
    picture: pinger_tuning/y_sign.png
    what: "Whether the USBL's left/right axis matches the boat's (+1) or is mirrored (-1)."
    lower: "-1 when it should be +1: the pinger appears on the wrong side of the boat and jumps across every pass."
    higher: "+1 is right for the antenna as installed (2026-10 data)."
    field: "Only change after re-installing the antenna: drive past a still pinger keeping it on the left; it must be drawn on the left."
  - title: "Trust in each fix"
    params: [sigma_bearing_deg]
    slider: {sigma_bearing_deg: [2.0, 45.0, log]}
    picture: pinger_tuning/sigma_bearing_deg.png
    what: "How noisy one USBL fix is assumed to be (sideways, as an angle). The main smoothing knob."
    lower: "Each fix is believed more; the pinger follows the noise and jumps around."
    higher: "Steadier, but slower to follow a real move; corners are cut."
    field: "Raise it if the filtered pinger jitters while the robot is still; lower it if it lags behind a robot you can see moving. Field data: 13-17 deg."
  - title: "Agility"
    params: [sigma_a]
    slider: {sigma_a: [0.001, 0.5, log]}
    picture: pinger_tuning/sigma_a.png
    what: "How quickly the robot may change speed or direction."
    lower: "Smoother and steadier when the robot stops, but it overshoots corners and is slow to turn with the robot."
    higher: "Turns with the robot quickly, but wanders while the robot is still."
    field: "Lower it for a robot that drives long straight lines; raise it if the pinger keeps overshooting the robot's turns."
  - title: "Top speed"
    params: [v_max]
    slider: {v_max: [0.05, 3.0, log]}
    picture: pinger_tuning/v_max.png
    what: "The fastest the robot can move. The estimate is never allowed to move faster."
    lower: "Below the robot's real speed: the pinger falls behind the robot and catches up only when it stops."
    higher: "Well above it: little change (the outlier gates do most of the work), but a wild fix can drag the pinger faster."
    field: "Set it a little above the robot's real top speed (brush robot 0.1-0.3 m/s: 0.5)."
  - title: "Outlier tolerance"
    params: [gate_soft]
    slider: {gate_soft: [1.0, 60.0, log]}
    picture: pinger_tuning/gate_soft.png
    what: "How far from the estimate a fix may land before it is believed less (a statistical distance; 5.99 = 95 %)."
    lower: "More fixes are doubted; steadier against wild fixes, slower to follow real moves."
    higher: "Wild fixes are believed and pull the pinger off."
    field: "Lower it where many fixes are wild (multipath near walls, a hull); raise it if the pinger refuses to follow a real move."
  - title: "Jump to a new place"
    params: [reinit_n, reinit_radius_m]
    slider: {reinit_n: [2, 12, lin], reinit_radius_m: [1.0, 15.0, log]}
    picture: pinger_tuning/reinit_n.png
    what: "When the robot really moves far (picked up and put down), how many far-off fixes, agreeing within what radius, make the filter jump there at once."
    lower: "Fewer fixes: jumps quickly, but a short burst of wild fixes can make it jump too."
    higher: "More fixes or a small radius: it never jumps and walks to the new place at the top speed (15 m takes about 25 s with the defaults)."
    field: "With field-level noise the default 2 m radius rarely agrees: raise the radius (5-8 m) if the pinger is slow to follow a robot that was moved."
  - title: "When to give up"
    params: [coast_after_s, stale_timeout_s]
    slider: {coast_after_s: [0.5, 20.0, log], stale_timeout_s: [1.0, 60.0, log]}
    picture: pinger_tuning/stale_timeout_s.png
    what: "How long without a USBL fix before the pinger is 'coasting' (still followed) and then 'stale' (Follow mode holds the boat in place)."
    lower: "Shorter: the boat stops following sooner when fixes drop out."
    higher: "Longer: the boat keeps steering to an old position for longer."
    field: "Raise it if the boat stops during short USBL dropouts; lower it if it keeps driving to an out-of-date position."
